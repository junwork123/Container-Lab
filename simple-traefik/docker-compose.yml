services:
  traefik:
    image: traefik:v3.0.1
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"  # Traefik 대시보드
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml

  application-server:
    image: alexwhen/docker-2048