user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
    server_tokens off; # 보안 설정을 위해 서버 버전 숨김

    upstream my_application {
        server application-server:80;
    }

    server {
        listen 80;
        listen [::]:80;

        # 보안 설정을 위해 기본 서버 블록에서는 모든 요청을 거부하고 404 오류를 반환
        return 404;
    }

    server {
        listen 443 ssl default_server; # 기본 서버 블록으로 설정
        listen [::]:443 ssl default_server;

        server_name junwork.net www.junwork.net;
        ssl_certificate /etc/nginx/ssl/origin_cert.pem;
        ssl_certificate_key /etc/nginx/ssl/private_key.pem;

        location / {
            proxy_pass http://my_application;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        error_page   500 502 503 504  /50x.html;

        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
